<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Storybook</title>
  <meta name="description" content="An illustrated, interactive storybook.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Caveat:wght@500;700&family=Bangers&family=Comic+Neue:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="book.css">
  <link rel="stylesheet" href="story.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="wc-edge" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="wc-wash" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" result="rough"/>
        <feGaussianBlur in="rough" stdDeviation="1.2" result="soft"/>
        <feComposite in="soft" in2="rough" operator="arithmetic" k1="0" k2="0.65" k3="0.45" k4="0"/>
      </filter>
      <filter id="wc-ink">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="2" result="grain"/>
        <feDisplacementMap in="SourceGraphic" in2="grain" scale="1.6"/>
      </filter>
    </defs>
  </svg>

  <main id="book" aria-live="polite">
    <div id="stage"></div>
    <nav id="controls">
      <button id="prev" aria-label="Previous page">&lsaquo;</button>
      <button id="next" aria-label="Next page">&rsaquo;</button>
    </nav>
    <div id="progress"><span></span></div>
  </main>
  <noscript>This storybook needs JavaScript to turn its pages.</noscript>
  <script type="module" src="book.js"></script>
  <script src="https://watermark.wasmer.app/watermark.js?url=powered-by-wasmer.svg&position=NW&margin=12&max-width=110&alt=Powered%20by%20Wasmer"></script>
</body>
</html>
